<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一元线性回归 · 课堂互动</title>
<link rel="stylesheet" href="style.css"></head><body>
<header><h1>一元线性回归 · 课堂互动</h1></header>
<nav><button data-tab="fit" class="on">① 回归拟合</button><button data-tab="pred">② 预测</button><button data-tab="resid">③ 残差与最小二乘</button><button data-tab="diag">④ 回归诊断</button></nav>
<main>
<section id="fit" class="on"><h2>每周锻炼时间预测抑郁得分</h2><div class="controls"><label><input type="checkbox" id="fitLine" checked>最小二乘回归线</label><label><input type="checkbox" id="fitBand" checked>95% 置信带</label><label><input type="checkbox" id="fitMean">Y 均值线</label></div><div class="row"><div class="plotcol"><div id="fitPlot"></div><p class="small">蓝点：真实观测（n = 80）</p></div><div class="side box"><h3>回归结果</h3><div id="fitStats" class="stats"></div></div></div></section>
<section id="pred"><h2>用回归方程预测 Y</h2><div class="controls"></div><div class="row"><div class="plotcol"><div id="predPlot"></div><div class="box"><div class="slider" id="predSliderRow"><span id="predLabel">每周锻炼时间 X</span><input type="range" id="predictX" step="0.1"><output id="predictXV" class="num"></output></div><div class="big" id="predictOut"></div></div></div><div class="side box"><h3>方程</h3><div id="predEq" class="big num"></div><p class="hint">可移动滑块，或直接点击图中的真实观测点。</p></div></div></section>
<section id="resid"><h2>残差：观测值 − 预测值</h2><div class="controls"><label><input type="checkbox" id="allResid">显示所有残差</label></div><div class="row"><div class="plotcol"><div id="resPlot"></div><p class="small">点击散点，查看该被试的残差。橙线表示观测值与回归线之间的竖直距离。</p></div><div class="side"><div class="box"><h3>选中的被试</h3><div class="stats" id="resInfo"></div></div><div class="box"><h3>最小二乘</h3><div id="sseStats" class="stats"></div></div></div></div></section>
<section id="diag"><h2>回归诊断</h2><div class="controls"><div class="buttons" id="diagMode"><button class="ghost on" data-mode="real">课堂数据</button><button class="ghost" data-mode="sim">模拟问题</button></div><label id="diagSimCtl" class="invisible">形态：<select id="diagKind"><option value="normal">随机散布</option><option value="curve">曲线趋势</option><option value="funnel">漏斗形</option><option value="skew">偏态残差</option><option value="tail">重尾 / 极端值</option></select></label><label id="diagNCtl" class="invisible">样本量 n：<select id="diagN"><option value="80">80</option><option value="150">150</option><option value="240" selected>240</option><option value="400">400</option></select></label><button id="nextSeed" class="ghost invisible">重新抽样</button></div>
<div class="two"><div class="subpanel"><h3>Residual vs Fitted</h3><div id="diagRF"></div><p id="rfHint" class="small"></p></div><div class="subpanel"><h3>Normal Q–Q Plot</h3><div id="diagQQ"></div><p id="qqHint" class="small"></p></div></div><div class="box small">左图：观察是否有曲线、漏斗或离群点。　右图：观察残差分位数是否大致沿参考直线排列。</div></section>
</main><script src="data.js"></script>
<script src="app.js"></script></body></html>
