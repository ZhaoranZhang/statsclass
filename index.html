<!doctype html>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --ink: #0f172a;
      --line: #e2e8f0;
      --card: #fff;
      --blue: #1d4ed8;
      --blue-line: #bfdbfe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
      font-size: 1.125rem;
      line-height: 1.6;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 1;
      background: rgba(255, 255, 255, 0.88);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    header h1 {
      max-width: 40rem;
      margin: 0 auto;
      padding: 1.1rem 1.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 1rem;
    }
    a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      padding: 1.15rem 1.25rem 1.35rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--card);
      color: inherit;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      text-decoration: none;
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
    }
    a:hover,
    a:focus-visible {
      color: var(--blue);
      border-color: var(--blue-line);
      transform: translateY(-4px);
      box-shadow: 0 16px 32px rgba(37, 99, 235, 0.08);
      outline: none;
    }
    svg {
      width: min(100%, 26rem);
      height: auto;
      display: block;
    }
  </style>
</head>
